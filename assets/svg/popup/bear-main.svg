<svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- ===== MARRÓN OSO premium ===== -->
  <radialGradient id="furLight" cx="40%" cy="35%" r="75%">
    <stop offset="0" stop-color="#eeddb8"/>
    <stop offset="0.55" stop-color="#caa376"/>
    <stop offset="1" stop-color="#9a7544"/>
  </radialGradient>
  <linearGradient id="furShadow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a17a4a" stop-opacity="0"/>
    <stop offset="1" stop-color="#704c28" stop-opacity="0.7"/>
  </linearGradient>
  <radialGradient id="furBelly" cx="50%" cy="40%" r="70%">
    <stop offset="0" stop-color="#fbeacd"/>
    <stop offset="1" stop-color="#dfc198"/>
  </radialGradient>
  <radialGradient id="furDark" cx="50%" cy="50%" r="80%">
    <stop offset="0" stop-color="#a4794a"/>
    <stop offset="1" stop-color="#6b4925"/>
  </radialGradient>

  <!-- ===== AZUL bebé (pajarita) ===== -->
  <radialGradient id="blueLight" cx="35%" cy="30%" r="80%">
    <stop offset="0" stop-color="#eaf3fb"/>
    <stop offset="0.5" stop-color="#a8cbe2"/>
    <stop offset="1" stop-color="#6f9fc0"/>
  </radialGradient>
  <linearGradient id="blueShadow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7da4be" stop-opacity="0"/>
    <stop offset="1" stop-color="#3d6f95" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="bluePaper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c6dceb"/>
    <stop offset="1" stop-color="#7ea5c0"/>
  </linearGradient>
  <linearGradient id="blueDeep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ea5c0"/>
    <stop offset="1" stop-color="#3d6f95"/>
  </linearGradient>

  <!-- ===== Highlight suave cuerpo (radial cálido) ===== -->
  <radialGradient id="bodyGlow" cx="35%" cy="30%" r="70%">
    <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="headGlow" cx="35%" cy="28%" r="65%">
    <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>

  <!-- ===== Filtros ===== -->
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
    <feOffset dx="0" dy="1.2" result="off"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="dropS" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    <feOffset dx="0" dy="3" result="off"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Sombra al piso -->
<ellipse cx="140" cy="312" rx="100" ry="7" fill="#000" opacity="0.16"/>

<!-- ============ PATITAS TRASERAS ============ -->
<!-- Pata trasera izquierda -->
<polygon points="22,260 14,290 30,308 78,304 80,272 60,256"
         fill="url(#furLight)" stroke="#5d452c" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="60,256 80,272 80,304 60,300" fill="url(#furShadow)" opacity="0.6"/>
<polygon points="34,288 70,288 72,300 56,308 34,304" fill="url(#furBelly)" stroke="#a88058" stroke-width="0.9" stroke-linejoin="round"/>
<ellipse cx="42" cy="298" rx="2.4" ry="1.8" fill="#5d452c" opacity="0.6"/>
<ellipse cx="52" cy="299" rx="2.4" ry="1.8" fill="#5d452c" opacity="0.6"/>
<ellipse cx="62" cy="298" rx="2.4" ry="1.8" fill="#5d452c" opacity="0.6"/>
<ellipse cx="52" cy="291" rx="4" ry="2.5" fill="#5d452c" opacity="0.45"/>

<!-- Pata trasera derecha -->
<polygon points="258,260 266,290 250,308 202,304 200,272 220,256"
         fill="url(#furLight)" stroke="#5d452c" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="220,256 200,272 200,304 220,300" fill="url(#furBelly)" stroke="#a88058" stroke-width="0.7"/>
<polygon points="210,288 246,288 246,304 224,308 208,300" fill="url(#furBelly)" stroke="#a88058" stroke-width="0.9" stroke-linejoin="round"/>
<ellipse cx="218" cy="298" rx="2.4" ry="1.8" fill="#5d452c" opacity="0.6"/>
<ellipse cx="228" cy="299" rx="2.4" ry="1.8" fill="#5d452c" opacity="0.6"/>
<ellipse cx="238" cy="298" rx="2.4" ry="1.8" fill="#5d452c" opacity="0.6"/>
<ellipse cx="228" cy="291" rx="4" ry="2.5" fill="#5d452c" opacity="0.45"/>

<!-- ============ CUERPO ============ -->
<polygon points="78,196 64,232 56,266 78,290 130,298 202,290 224,266 216,232 202,196 178,182 100,182"
         fill="url(#furLight)" stroke="#5d452c" stroke-width="1.8" stroke-linejoin="round"/>
<!-- Sombra lateral derecha (suavizada) -->
<polygon points="178,182 202,196 216,232 224,266 202,290 140,290 140,232"
         fill="url(#furShadow)" opacity="0.52"/>
<!-- Pliegue central -->
<line x1="140" y1="182" x2="202" y2="290" stroke="#5d452c" stroke-width="0.6" stroke-dasharray="2 2.5" opacity="0.4"/>
<!-- Highlight volumétrico cuerpo (superior-izquierda) -->
<polygon points="78,196 64,232 56,266 78,290 130,298 140,290 140,232"
         fill="url(#bodyGlow)"/>

<!-- Panza crema -->
<polygon points="104,212 176,212 188,240 178,270 156,288 124,288 102,270 92,240"
         fill="url(#furBelly)" stroke="#a88058" stroke-width="1.1" stroke-linejoin="round"/>
<polygon points="176,212 188,240 178,270 156,288 140,270 140,212" fill="#d4b387" opacity="0.5"/>
<!-- Costura central panza -->
<line x1="140" y1="212" x2="140" y2="288" stroke="#a88058" stroke-width="0.5" stroke-dasharray="1.5 2" opacity="0.5"/>
<!-- Ombligo -->
<ellipse cx="140" cy="254" rx="4" ry="3.2" fill="#a88058" opacity="0.5"/>
<ellipse cx="140" cy="253" rx="2.2" ry="1.8" fill="#8a6040" opacity="0.55"/>

<!-- ============ BRAZOS ============ -->
<!-- Brazo izquierdo -->
<polygon points="72,196 42,212 32,246 60,256 86,232" fill="url(#furLight)" stroke="#5d452c" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="42,212 32,246 60,256 46,236" fill="url(#furShadow)" opacity="0.7"/>
<ellipse cx="44" cy="248" rx="11" ry="8" fill="url(#furBelly)" stroke="#a88058" stroke-width="0.9"/>
<ellipse cx="40" cy="250" rx="1.5" ry="1.2" fill="#5d452c" opacity="0.55"/>
<ellipse cx="48" cy="251" rx="1.5" ry="1.2" fill="#5d452c" opacity="0.55"/>
<ellipse cx="44" cy="245" rx="1.5" ry="1.2" fill="#5d452c" opacity="0.55"/>

<!-- Brazo derecho -->
<polygon points="208,196 238,212 248,246 220,256 194,232" fill="url(#furLight)" stroke="#5d452c" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="208,196 238,212 248,246 220,256" fill="url(#furShadow)" opacity="0.8"/>
<ellipse cx="236" cy="248" rx="11" ry="8" fill="url(#furBelly)" stroke="#a88058" stroke-width="0.9"/>
<ellipse cx="232" cy="250" rx="1.5" ry="1.2" fill="#5d452c" opacity="0.55"/>
<ellipse cx="240" cy="251" rx="1.5" ry="1.2" fill="#5d452c" opacity="0.55"/>
<ellipse cx="236" cy="245" rx="1.5" ry="1.2" fill="#5d452c" opacity="0.55"/>

<!-- ============ CABEZA ============ -->
<polygon points="64,98 50,134 56,170 80,196 130,202 180,196 204,170 210,134 196,98 168,76 92,76"
         fill="url(#furLight)" stroke="#5d452c" stroke-width="1.9" stroke-linejoin="round"/>
<!-- Sombra lateral derecha cabeza (suavizada) -->
<polygon points="168,76 196,98 210,134 204,170 180,196 130,202 130,134"
         fill="url(#furShadow)" opacity="0.52"/>
<!-- Pliegue central cabeza -->
<line x1="130" y1="76" x2="130" y2="202" stroke="#5d452c" stroke-width="0.7" stroke-dasharray="2.5 2.5" opacity="0.5"/>
<line x1="50" y1="134" x2="210" y2="134" stroke="#5d452c" stroke-width="0.5" stroke-dasharray="1.5 2.5" opacity="0.3"/>
<!-- Highlight volumétrico cabeza -->
<polygon points="64,98 50,134 56,170 80,196 130,202 130,134"
         fill="url(#headGlow)"/>

<!-- ============ OREJAS ============ -->
<!-- Oreja izquierda -->
<circle cx="68" cy="78" r="22" fill="url(#furLight)" stroke="#5d452c" stroke-width="1.6"/>
<path d="M 68 56 A 22 22 0 0 1 90 78" fill="url(#furShadow)" opacity="0.6" stroke="none"/>
<ellipse cx="70" cy="80" rx="11" ry="13" fill="url(#furBelly)" stroke="#a88058" stroke-width="0.9"/>
<ellipse cx="72" cy="80" rx="5" ry="7" fill="#d4b387" opacity="0.5"/>
<!-- Interior rosado oreja izquierda -->
<ellipse cx="70" cy="82" rx="4" ry="5.5" fill="#f0a4a0" opacity="0.6"/>
<ellipse cx="70" cy="82" rx="2" ry="3" fill="#e88080" opacity="0.4"/>

<!-- Oreja derecha -->
<circle cx="192" cy="78" r="22" fill="url(#furLight)" stroke="#5d452c" stroke-width="1.6"/>
<path d="M 192 56 A 22 22 0 0 1 214 78" fill="url(#furShadow)" opacity="0.6" stroke="none"/>
<ellipse cx="190" cy="80" rx="11" ry="13" fill="url(#furBelly)" stroke="#a88058" stroke-width="0.9"/>
<ellipse cx="188" cy="80" rx="5" ry="7" fill="#d4b387" opacity="0.5"/>
<!-- Interior rosado oreja derecha -->
<ellipse cx="190" cy="82" rx="4" ry="5.5" fill="#f0a4a0" opacity="0.6"/>
<ellipse cx="190" cy="82" rx="2" ry="3" fill="#e88080" opacity="0.4"/>

<!-- ============ HOCICO ============ -->
<polygon points="92,148 130,134 168,148 162,180 130,190 98,180"
         fill="url(#furBelly)" stroke="#a88058" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="130,134 168,148 162,180 130,166" fill="#dcbf8e" opacity="0.65"/>
<line x1="130" y1="134" x2="130" y2="190" stroke="#a88058" stroke-width="0.5" stroke-dasharray="1.5 2" opacity="0.55"/>
<line x1="92" y1="148" x2="168" y2="148" stroke="#a88058" stroke-width="0.4" stroke-dasharray="1 2" opacity="0.5"/>

<!-- ============ NARIZ ============ -->
<polygon points="116,152 144,152 130,168" fill="#2a1810" stroke="#1a1008" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="120,154 140,154 130,165" fill="#4a3020" opacity="0.85"/>
<polygon points="124,155 134,155 130,160" fill="#7a5a3a" opacity="0.95"/>
<!-- Brillo de la nariz -->
<ellipse cx="126" cy="157" rx="2.8" ry="1.8" fill="#ffffff" opacity="0.85"/>

<!-- ============ BOCA ============ -->
<path d="M130,168 L130,178 M130,178 Q120,184 113,179 M130,178 Q140,184 147,179"
      stroke="#2a1810" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ============ MEJILLAS ROSADAS (rubor) ============ -->
<ellipse cx="81" cy="164" rx="18" ry="12" fill="#d86060" opacity="0.15"/>
<ellipse cx="179" cy="164" rx="18" ry="12" fill="#d86060" opacity="0.15"/>

<!-- ============ OJOS GRANDES Y REDONDOS ============ -->
<!-- Ojo izquierdo (más grande y expresivo) -->
<circle cx="100" cy="134" r="10" fill="#2a1810"/>
<circle cx="104" cy="130" r="3.5" fill="#fff" opacity="0.95"/>
<circle cx="97" cy="139" r="1.8" fill="#fff" opacity="0.75"/>
<!-- Ojo derecho -->
<circle cx="160" cy="134" r="10" fill="#2a1810"/>
<circle cx="164" cy="130" r="3.5" fill="#fff" opacity="0.95"/>
<circle cx="157" cy="139" r="1.8" fill="#fff" opacity="0.75"/>

<!-- Cejitas suaves -->
<path d="M86,116 Q100,110 112,116" stroke="#5d452c" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.55"/>
<path d="M148,116 Q160,110 174,116" stroke="#5d452c" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.55"/>

<!-- ============ PAJARITA AZUL ============ -->
<!-- Cinta izquierda con facetas -->
<polygon points="86,200 122,212 86,224" fill="url(#blueLight)" stroke="#3d6f95" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="86,200 122,212 86,212" fill="url(#bluePaper)" opacity="0.65"/>
<polygon points="98,206 122,212 98,218" fill="url(#blueShadow)" opacity="0.4"/>
<!-- Brillo cinta izquierda -->
<ellipse cx="95" cy="208" rx="6" ry="7" fill="#fff" opacity="0.2" transform="rotate(-20,95,208)"/>

<!-- Cinta derecha -->
<polygon points="174,200 138,212 174,224" fill="url(#blueLight)" stroke="#3d6f95" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="174,200 138,212 174,212" fill="url(#blueShadow)" opacity="0.55"/>
<polygon points="162,206 138,212 162,218" fill="url(#blueShadow)" opacity="0.5"/>

<!-- Nudo central de la pajarita -->
<polygon points="118,202 142,202 142,222 118,222" fill="url(#blueLight)" stroke="#3d6f95" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="130,202 142,202 142,222 130,222" fill="url(#blueShadow)" opacity="0.6"/>
<line x1="130" y1="202" x2="130" y2="222" stroke="#3d6f95" stroke-width="0.6" stroke-dasharray="1 1.5" opacity="0.7"/>
<!-- Brillito en el nudo -->
<ellipse cx="124" cy="208" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.55"/>
<!-- Brillo secundario nudo -->
<ellipse cx="127" cy="212" rx="1.2" ry="1.5" fill="#ffffff" opacity="0.35"/>
</svg>
