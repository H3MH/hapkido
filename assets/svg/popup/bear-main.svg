<svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oso de peluche corregido con cuerpo centrado, brazos y patas redondeadas, y pajarita centrada">
  <defs>
    <!-- ==================== GRADIENTES DE PIEL PRINCIPAL ==================== -->
    <radialGradient id="furBase" cx="42%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f7e7c9"/>
      <stop offset="32%" stop-color="#ddb98a"/>
      <stop offset="72%" stop-color="#a9763d"/>
      <stop offset="100%" stop-color="#704721"/>
    </radialGradient>

    <radialGradient id="furDark" cx="60%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#b9844d"/>
      <stop offset="52%" stop-color="#85562c"/>
      <stop offset="100%" stop-color="#523214"/>
    </radialGradient>

    <radialGradient id="furCream" cx="46%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#fff0d5"/>
      <stop offset="100%" stop-color="#e0bf8a"/>
    </radialGradient>

    <linearGradient id="furShadowGrad" x1="0%" y1="0%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#8a5a30" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4d2f13" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="furSoftShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b210e" stop-opacity="0.22"/>
    </linearGradient>

    <!-- ==================== GRADIENTES PARA LA PAJARITA ==================== -->
    <radialGradient id="bowBlue" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#f5fbff"/>
      <stop offset="27%" stop-color="#bde4fb"/>
      <stop offset="72%" stop-color="#66add1"/>
      <stop offset="100%" stop-color="#2e7299"/>
    </radialGradient>

    <linearGradient id="bowShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78c4e6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1f5578" stop-opacity="0.68"/>
    </linearGradient>

    <radialGradient id="bowKnot" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#eaf8ff"/>
      <stop offset="35%" stop-color="#9fd4ee"/>
      <stop offset="100%" stop-color="#2f739a"/>
    </radialGradient>

    <!-- ==================== ILUMINACIÓN GLOBAL ==================== -->
    <radialGradient id="globalGlow" cx="34%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="headGlow" cx="34%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="eyeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.75"/>
      <feOffset dx="0" dy="0.8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#44250e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ==================== SOMBRA EN EL SUELO ==================== -->
  <ellipse cx="140" cy="310" rx="110" ry="10" fill="#3a2a1a" opacity="0.22" filter="url(#groundShadow)"/>

  <!-- ==================== PATAS TRASERAS / PIES REDONDEADOS ==================== -->
  <!-- Pata trasera izquierda: más baja, redondeada y conectada visualmente al cuerpo -->
  <g id="pata-izquierda">
    <path d="M 29 254 C 44 247 67 248 80 262 C 91 274 86 295 74 302 C 58 307 32 306 20 300 C 12 292 17 265 29 254 Z"
          fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 60 253 C 78 260 87 276 80 294 C 72 303 51 305 33 301 C 41 282 47 266 60 253 Z"
          fill="url(#furShadowGrad)" opacity="0.48"/>
    <ellipse cx="50" cy="288" rx="15" ry="9.5" fill="url(#furCream)" stroke="#a08060" stroke-width="0.9"/>
    <ellipse cx="38" cy="294" rx="4" ry="3" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
    <ellipse cx="50" cy="297" rx="4.4" ry="3.2" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
    <ellipse cx="62" cy="294" rx="4" ry="3" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
    <ellipse cx="46" cy="285" rx="6.5" ry="3.2" fill="#ffffff" opacity="0.26"/>
    <path d="M 36 292 Q 36 289 39 289" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 49 295 Q 49 292 52 292" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 61 292 Q 61 289 64 289" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Pata trasera derecha -->
  <g id="pata-derecha">
    <path d="M 251 254 C 236 247 213 248 200 262 C 189 274 194 295 206 302 C 222 307 248 306 260 300 C 268 292 263 265 251 254 Z"
          fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 220 253 C 202 260 193 276 200 294 C 208 303 229 305 247 301 C 239 282 233 266 220 253 Z"
          fill="url(#furShadowGrad)" opacity="0.52"/>
    <ellipse cx="230" cy="288" rx="15" ry="9.5" fill="url(#furCream)" stroke="#a08060" stroke-width="0.9"/>
    <ellipse cx="218" cy="294" rx="4" ry="3" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
    <ellipse cx="230" cy="297" rx="4.4" ry="3.2" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
    <ellipse cx="242" cy="294" rx="4" ry="3" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
    <ellipse cx="234" cy="285" rx="6.5" ry="3.2" fill="#ffffff" opacity="0.26"/>
    <path d="M 216 292 Q 216 289 219 289" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 229 295 Q 229 292 232 292" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 241 292 Q 241 289 244 289" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- ==================== BRAZOS REDISEÑADOS ==================== -->
  <!-- Los brazos quedan detrás del torso para que no parezcan piezas sueltas. -->
  <g id="brazos">
    <g id="brazo-izquierdo">
      <path d="M 80 190 C 61 198 47 215 42 236 C 38 253 48 262 63 257 C 78 252 91 237 98 218 C 101 207 95 196 80 190 Z"
            fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 45 235 C 41 252 51 259 63 257 C 54 248 51 236 56 220 C 50 225 47 230 45 235 Z"
            fill="url(#furShadowGrad)" opacity="0.48"/>
      <ellipse cx="57" cy="247" rx="12" ry="8.3" fill="url(#furCream)" stroke="#a08060" stroke-width="0.9"/>
      <ellipse cx="47" cy="249" rx="3.4" ry="2.5" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
      <ellipse cx="57" cy="252" rx="3.9" ry="2.8" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
      <ellipse cx="67" cy="249" rx="3.4" ry="2.5" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
      <ellipse cx="54" cy="244" rx="5" ry="2.6" fill="#ffffff" opacity="0.28"/>
      <path d="M 46 247 Q 46 245 49 245" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 56 250 Q 56 247 59 247" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 66 247 Q 66 245 69 245" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <g id="brazo-derecho">
      <path d="M 200 190 C 219 198 233 215 238 236 C 242 253 232 262 217 257 C 202 252 189 237 182 218 C 179 207 185 196 200 190 Z"
            fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 200 190 C 219 198 233 215 238 236 C 241 250 235 259 222 259 C 221 239 213 211 200 190 Z"
            fill="url(#furShadowGrad)" opacity="0.54"/>
      <ellipse cx="223" cy="247" rx="12" ry="8.3" fill="url(#furCream)" stroke="#a08060" stroke-width="0.9"/>
      <ellipse cx="213" cy="249" rx="3.4" ry="2.5" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
      <ellipse cx="223" cy="252" rx="3.9" ry="2.8" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
      <ellipse cx="233" cy="249" rx="3.4" ry="2.5" fill="url(#furCream)" stroke="#a08060" stroke-width="0.7"/>
      <ellipse cx="226" cy="244" rx="5" ry="2.6" fill="#ffffff" opacity="0.28"/>
      <path d="M 212 247 Q 212 245 215 245" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 222 250 Q 222 247 225 247" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 232 247 Q 232 245 235 245" fill="none" stroke="#6a4a2a" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== CUERPO PRINCIPAL ==================== -->
  <g id="cuerpo">
    <path d="M 80 188 C 68 204 58 240 60 265 C 63 287 95 298 140 302 C 185 298 217 287 220 265 C 222 240 212 204 200 188 C 184 180 164 177 140 177 C 116 177 96 180 80 188 Z"
          fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M 140 177 C 164 177 184 180 200 188 C 212 204 222 240 220 265 C 217 287 185 298 140 302 Z"
          fill="url(#furShadowGrad)" opacity="0.45"/>
    <path d="M 80 188 C 68 204 58 240 60 265 C 63 287 95 298 140 302 L 140 177 C 116 177 96 180 80 188 Z"
          fill="url(#globalGlow)" opacity="0.85"/>
    <!-- Costura central del cuerpo alineada con la cabeza y la pajarita -->
    <path d="M 140 184 L 140 202 M 140 214 L 140 291" fill="none" stroke="#8a6a4a" stroke-width="0.9" stroke-dasharray="3 2.5" opacity="0.78"/>
  </g>

  <!-- Panza clara centrada -->
  <g id="panza">
    <path d="M 103 210 C 113 200 128 196 140 198 C 152 196 167 200 177 210 C 188 230 190 250 180 268 C 170 282 155 291 140 291 C 125 291 110 282 100 268 C 90 250 92 230 103 210 Z"
          fill="url(#furCream)" stroke="#a08060" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M 140 198 C 152 196 167 200 177 210 C 188 230 190 250 180 268 C 170 282 155 291 140 291 Z"
          fill="#c8a878" opacity="0.30"/>
    <path d="M 140 202 L 140 289" fill="none" stroke="#a08060" stroke-width="0.7" stroke-dasharray="2 2.5" opacity="0.65"/>
    <ellipse cx="140" cy="252" rx="4.4" ry="3.4" fill="#a08060" opacity="0.45"/>
    <ellipse cx="140" cy="251" rx="2.4" ry="1.9" fill="#8a6040" opacity="0.55"/>
    <ellipse cx="139" cy="250" rx="1" ry="0.7" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- ==================== OREJAS DETRÁS DE LA CABEZA ==================== -->
  <g id="oreja-izquierda">
    <circle cx="80" cy="76" r="22" fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.7"/>
    <path d="M 80 54 A 22 22 0 0 1 102 76 A 22 22 0 0 0 80 54" fill="url(#furShadowGrad)" opacity="0.66"/>
    <ellipse cx="80" cy="80" rx="12.3" ry="14" fill="url(#furCream)" stroke="#a08060" stroke-width="0.9"/>
    <ellipse cx="80" cy="82" rx="7" ry="9" fill="#f5c0b8" opacity="0.55"/>
    <ellipse cx="80" cy="82" rx="3.5" ry="5" fill="#e8a0a0" opacity="0.4"/>
    <path d="M 72 66 A 14 14 0 0 1 88 62" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  </g>

  <g id="oreja-derecha">
    <circle cx="200" cy="76" r="22" fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.7"/>
    <path d="M 200 54 A 22 22 0 0 1 222 76 A 22 22 0 0 0 200 54" fill="url(#furShadowGrad)" opacity="0.66"/>
    <ellipse cx="200" cy="80" rx="12.3" ry="14" fill="url(#furCream)" stroke="#a08060" stroke-width="0.9"/>
    <ellipse cx="200" cy="82" rx="7" ry="9" fill="#f5c0b8" opacity="0.55"/>
    <ellipse cx="200" cy="82" rx="3.5" ry="5" fill="#e8a0a0" opacity="0.4"/>
    <path d="M 192 66 A 14 14 0 0 1 208 62" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- ==================== CABEZA CENTRADA ==================== -->
  <g id="cabeza">
    <path d="M 76 96 L 62 132 L 68 168 L 90 194 L 140 200 L 190 194 L 212 168 L 218 132 L 204 96 L 176 74 L 104 74 Z"
          fill="url(#furBase)" stroke="#6a4a2a" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M 176 74 L 204 96 L 218 132 L 212 168 L 190 194 L 140 200 L 140 132 Z"
          fill="url(#furShadowGrad)" opacity="0.50"/>
    <path d="M 76 96 L 62 132 L 68 168 L 90 194 L 140 200 L 140 132 Z"
          fill="url(#headGlow)" opacity="0.88"/>
    <!-- Costuras ahora pasan exactamente por el centro del oso -->
    <path d="M 140 76 L 140 198" fill="none" stroke="#8a6a4a" stroke-width="0.8" stroke-dasharray="2.5 2.5" opacity="0.78"/>
    <path d="M 70 132 L 210 132" fill="none" stroke="#8a6a4a" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.45"/>
  </g>

  <!-- ==================== MEJILLAS SONROSADAS ==================== -->
  <ellipse cx="90" cy="164" rx="16" ry="11" fill="#e87070" opacity="0.18"/>
  <ellipse cx="90" cy="164" rx="10" ry="7" fill="#f5a0a0" opacity="0.12"/>
  <ellipse cx="190" cy="164" rx="16" ry="11" fill="#e87070" opacity="0.18"/>
  <ellipse cx="190" cy="164" rx="10" ry="7" fill="#f5a0a0" opacity="0.12"/>

  <!-- ==================== HOCICO CENTRADO ==================== -->
  <g id="hocico">
    <path d="M 104 146 L 140 132 L 176 146 L 170 178 L 140 188 L 110 178 Z"
          fill="url(#furCream)" stroke="#a08060" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 140 132 L 176 146 L 170 178 L 140 164 Z" fill="#d4b890" opacity="0.48"/>
    <line x1="140" y1="132" x2="140" y2="188" stroke="#a08060" stroke-width="0.6" stroke-dasharray="2 2.5" opacity="0.7"/>
    <line x1="104" y1="146" x2="176" y2="146" stroke="#a08060" stroke-width="0.5" stroke-dasharray="2 2.5" opacity="0.55"/>
  </g>

  <!-- ==================== OJOS EXPRESIVOS ==================== -->
  <g filter="url(#eyeShadow)" id="ojo-izquierdo">
    <circle cx="110" cy="132" r="11" fill="#1a0e08"/>
    <circle cx="110" cy="132" r="9" fill="#2a1a10"/>
    <circle cx="110" cy="132" r="6" fill="#0a0505"/>
    <circle cx="114" cy="128" r="3.5" fill="#ffffff"/>
    <circle cx="107" cy="136" r="1.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="112" cy="132" r="1" fill="#ffffff" opacity="0.5"/>
  </g>

  <g filter="url(#eyeShadow)" id="ojo-derecho">
    <circle cx="170" cy="132" r="11" fill="#1a0e08"/>
    <circle cx="170" cy="132" r="9" fill="#2a1a10"/>
    <circle cx="170" cy="132" r="6" fill="#0a0505"/>
    <circle cx="174" cy="128" r="3.5" fill="#ffffff"/>
    <circle cx="167" cy="136" r="1.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="172" cy="132" r="1" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Cejas suaves, alineadas con los ojos -->
  <path d="M 94 114 Q 110 108 122 114" fill="none" stroke="#5a3a1a" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
  <path d="M 158 114 Q 170 108 186 114" fill="none" stroke="#5a3a1a" stroke-width="2" stroke-linecap="round" opacity="0.72"/>

  <!-- ==================== NARIZ Y BOCA ==================== -->
  <g id="nariz-boca">
    <ellipse cx="140" cy="158" rx="12" ry="8" fill="#1a0e08"/>
    <ellipse cx="140" cy="157" rx="10" ry="6.5" fill="#3a2212"/>
    <ellipse cx="136" cy="154" rx="4" ry="2.5" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="145" cy="159" rx="2" ry="1.2" fill="#ffffff" opacity="0.4"/>
    <path d="M 140 166 L 140 176" fill="none" stroke="#2a1008" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 140 176 Q 128 182 122 176" fill="none" stroke="#2a1008" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 140 176 Q 152 182 158 176" fill="none" stroke="#2a1008" stroke-width="2.1" stroke-linecap="round"/>
  </g>

  <!-- ==================== PAJARITA AZUL CENTRADA Y MÁS CURVA ==================== -->
  <g id="pajarita" filter="url(#softDrop)">
    <!-- Ala izquierda, con borde curvo y pinzamiento realista hacia el nudo -->
    <path d="M 131 204 C 119 195 101 190 86 190 C 84 201 84 214 86 226 C 103 222 121 216 132 208 Z"
          fill="url(#bowBlue)" stroke="#347090" stroke-width="1.35" stroke-linejoin="round"/>
    <path d="M 87 193 C 103 201 118 205 132 207 C 118 208 101 214 87 223 C 90 213 90 202 87 193 Z"
          fill="url(#bowShadow)" opacity="0.38"/>
    <path d="M 101 198 C 111 202 122 205 132 207" fill="none" stroke="#2e7299" stroke-width="0.8" opacity="0.55" stroke-linecap="round"/>
    <ellipse cx="98" cy="205" rx="6" ry="8" fill="#ffffff" opacity="0.25" transform="rotate(-25 98 205)"/>

    <!-- Ala derecha, espejo de la izquierda -->
    <path d="M 149 204 C 161 195 179 190 194 190 C 196 201 196 214 194 226 C 177 222 159 216 148 208 Z"
          fill="url(#bowBlue)" stroke="#347090" stroke-width="1.35" stroke-linejoin="round"/>
    <path d="M 193 193 C 177 201 162 205 148 207 C 162 208 179 214 193 223 C 190 213 190 202 193 193 Z"
          fill="url(#bowShadow)" opacity="0.43"/>
    <path d="M 179 198 C 169 202 158 205 148 207" fill="none" stroke="#2e7299" stroke-width="0.8" opacity="0.55" stroke-linecap="round"/>
    <ellipse cx="182" cy="205" rx="6" ry="8" fill="#ffffff" opacity="0.25" transform="rotate(25 182 205)"/>

    <!-- Nudo central: exacto en x=140 y con volumen -->
    <ellipse cx="140" cy="207" rx="10.5" ry="13" fill="url(#bowKnot)" stroke="#347090" stroke-width="1.25"/>
    <ellipse cx="142" cy="210" rx="7" ry="9" fill="url(#bowShadow)" opacity="0.48"/>
    <path d="M 140 195 L 140 219" fill="none" stroke="#2e7299" stroke-width="0.65" stroke-dasharray="1.5 2" opacity="0.75"/>
    <ellipse cx="135" cy="202" rx="3.1" ry="4.6" fill="#ffffff" opacity="0.70"/>
    <ellipse cx="138" cy="207" rx="1.5" ry="2" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
