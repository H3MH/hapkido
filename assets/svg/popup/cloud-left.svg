<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 100" preserveAspectRatio="xMidYMid meet" role="img">
  <defs>
    <linearGradient id="paperTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".54" stop-color="#f2f7fa"/>
      <stop offset="1" stop-color="#d5e0e8"/>
    </linearGradient>
    <linearGradient id="paperWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".58" stop-color="#eef4f7"/>
      <stop offset="1" stop-color="#c6d4df"/>
    </linearGradient>
    <linearGradient id="paperCool" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf5fa"/>
      <stop offset=".58" stop-color="#d4e0e8"/>
      <stop offset="1" stop-color="#a6b8c5"/>
    </linearGradient>
    <linearGradient id="paperShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfdce5"/>
      <stop offset="1" stop-color="#879aa9"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6c6d2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6f8495" stop-opacity=".5"/>
    </linearGradient>
    <pattern id="cloudFiber" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M2 3h2M8 2h1M12 6h1M5 11h2M10 13h1" stroke="#8da1b0" stroke-width=".42" opacity=".24"/>
      <path d="M1 9h1M6 6h2M12 1h1" stroke="#fff" stroke-width=".42" opacity=".45"/>
    </pattern>
    <filter id="cloudLift" x="-14%" y="-24%" width="128%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#5a7184" flood-opacity=".22"/>
    </filter>
    <clipPath id="cloudShape">
      <path d="M10 63 25 44 42 42 53 27 74 18 94 22 108 12 132 20 146 36 160 46 156 68 140 79 110 80 91 74 67 82 40 76 24 79Z"/>
    </clipPath>
  </defs>

  <g filter="url(#cloudLift)" clip-path="url(#cloudShape)" stroke="#9aadb9" stroke-width="1" stroke-linejoin="round">
    <path d="M10 63 25 44 42 42 53 27 74 18 94 22 108 12 132 20 146 36 160 46 156 68 140 79 110 80 91 74 67 82 40 76 24 79Z" fill="url(#paperTop)"/>

    <polygon points="10,63 25,44 42,42 37,62 24,79" fill="url(#paperWarm)"/>
    <polygon points="25,44 53,27 74,18 65,49 37,62 42,42" fill="#fbfdff"/>
    <polygon points="37,62 65,49 67,82 40,76 24,79" fill="url(#paperCool)" opacity=".86"/>
    <polygon points="74,18 94,22 108,12 101,48 65,49" fill="url(#paperTop)"/>
    <polygon points="65,49 101,48 91,74 67,82" fill="#e5edf3"/>
    <polygon points="101,48 108,12 132,20 124,52" fill="#f8fbfd"/>
    <polygon points="124,52 132,20 146,36 160,46 144,64" fill="url(#paperCool)" opacity=".94"/>
    <polygon points="101,48 124,52 110,80 91,74" fill="#dce7ee"/>
    <polygon points="124,52 144,64 140,79 110,80" fill="url(#paperShadow)" opacity=".64"/>
    <polygon points="37,62 65,49 101,48 91,74 67,82" fill="url(#bottomShade)" opacity=".48"/>
    <rect width="170" height="100" fill="url(#cloudFiber)" opacity=".38"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M25 44 37 62 24 79M53 27 65 49 67 82M74 18 65 49M94 22 101 48 91 74M108 12 101 48M132 20 124 52 110 80M146 36 144 64" stroke="#ffffff" stroke-width=".95" opacity=".72"/>
    <path d="M37 62 65 49 101 48 124 52 144 64M67 82 91 74 110 80" stroke="#7f95a5" stroke-width=".65" opacity=".5"/>
    <path d="M31 52C49 42 62 35 81 33M87 61C105 58 123 58 141 64" stroke="#ffffff" stroke-width="2.4" opacity=".36"/>
  </g>
