<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 130">
<defs>
  <!-- Panel verde salvia -->
  <linearGradient id="gPA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e0edd8"/>
    <stop offset="55%" stop-color="#96b488"/>
    <stop offset="100%" stop-color="#4a6848"/>
  </linearGradient>
  <!-- Panel crema -->
  <linearGradient id="gPB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fffaed"/>
    <stop offset="55%" stop-color="#e8d4a0"/>
    <stop offset="100%" stop-color="#a88a55"/>
  </linearGradient>
  <!-- Highlight radial superior-izquierdo -->
  <radialGradient id="gHlt" cx="28%" cy="22%" r="68%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.52"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <!-- Sombra diagonal -->
  <linearGradient id="gDim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.22"/>
  </linearGradient>
  <!-- Canasta -->
  <linearGradient id="gBsk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d4a870"/>
    <stop offset="100%" stop-color="#8a5828"/>
  </linearGradient>
  <!-- Cuello salvia -->
  <linearGradient id="gNck" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7a9870"/>
    <stop offset="100%" stop-color="#3a5830"/>
  </linearGradient>
  <!-- Clip oval -->
  <clipPath id="bClip">
    <ellipse cx="45" cy="37" rx="29" ry="31"/>
  </clipPath>
</defs>

<!-- Sombra suave -->
<ellipse cx="46.5" cy="39" rx="29" ry="31" fill="#000" opacity="0.07"/>

<!-- Tono base salvia oscuro -->
<ellipse cx="45" cy="37" rx="29" ry="31" fill="#3a5830"/>

<!-- ═══ PANELES (salvia + crema alternados) ═══ -->
<g clip-path="url(#bClip)">
  <rect x="15" y="0" width="10" height="80" fill="url(#gPA)"/>
  <rect x="25" y="0" width="10" height="80" fill="url(#gPB)"/>
  <rect x="35" y="0" width="10" height="80" fill="url(#gPA)"/>
  <rect x="45" y="0" width="10" height="80" fill="url(#gPB)"/>
  <rect x="55" y="0" width="10" height="80" fill="url(#gPA)"/>
  <rect x="65" y="0" width="10" height="80" fill="url(#gPB)"/>
  <rect x="0" y="0" width="90" height="130" fill="url(#gDim)"/>
  <ellipse cx="45" cy="65" rx="25" ry="7.5" fill="#000" opacity="0.14"/>
</g>

<!-- Costuras entre paneles -->
<g clip-path="url(#bClip)" opacity="0.35">
  <line x1="25" y1="0" x2="25" y2="80" stroke="#2c4828" stroke-width="0.8"/>
  <line x1="35" y1="0" x2="35" y2="80" stroke="#8a6c36" stroke-width="0.8"/>
  <line x1="45" y1="0" x2="45" y2="80" stroke="#2c4828" stroke-width="0.8"/>
  <line x1="55" y1="0" x2="55" y2="80" stroke="#8a6c36" stroke-width="0.8"/>
  <line x1="65" y1="0" x2="65" y2="80" stroke="#2c4828" stroke-width="0.8"/>
</g>

<!-- Banda ecuatorial dorada -->
<g clip-path="url(#bClip)">
  <ellipse cx="45" cy="37" rx="29" ry="3" fill="#c8a030" opacity="0.62"/>
  <ellipse cx="45" cy="37" rx="29" ry="1.2" fill="#ffe070" opacity="0.5"/>
</g>

<!-- Highlight -->
<ellipse cx="45" cy="37" rx="29" ry="31" fill="url(#gHlt)"/>

<!-- Contorno salvia oscuro -->
<ellipse cx="45" cy="37" rx="29" ry="31" fill="none" stroke="#2c4828" stroke-width="1.5"/>

<!-- Finial -->
<ellipse cx="45" cy="7.5" rx="6" ry="2.8" fill="#2c4828" opacity="0.85"/>
<ellipse cx="43.5" cy="6.8" rx="2.8" ry="1.3" fill="#fff" opacity="0.68"/>
<circle cx="45" cy="6.5" r="1.2" fill="#fff" opacity="0.42"/>

<!-- Cuello salvia -->
<path d="M37,67 C40,73 42,76 45,75 C48,76 50,73 53,67"
      fill="url(#gNck)" stroke="#2c4828" stroke-width="1.1"/>
<ellipse cx="45" cy="75.5" rx="7.5" ry="2.2" fill="#2c4828" opacity="0.45"/>

<!-- Cuerdas -->
<line x1="38" y1="74" x2="30" y2="86" stroke="#7a5828" stroke-width="1.05" stroke-linecap="round"/>
<line x1="43" y1="76" x2="38" y2="86" stroke="#7a5828" stroke-width="1.05" stroke-linecap="round"/>
<line x1="47" y1="76" x2="52" y2="86" stroke="#7a5828" stroke-width="1.05" stroke-linecap="round"/>
<line x1="52" y1="74" x2="60" y2="86" stroke="#7a5828" stroke-width="1.05" stroke-linecap="round"/>

<!-- Canasta -->
<rect x="27" y="84" width="36" height="4.5" rx="2.2" fill="#c8a058" stroke="#7a5028" stroke-width="1.1"/>
<rect x="28" y="88.5" width="34" height="20" rx="2.5" fill="url(#gBsk)" stroke="#7a5028" stroke-width="1.3"/>
<rect x="45" y="88.5" width="17" height="20" fill="#000" opacity="0.22"/>
<line x1="29" y1="94.5" x2="61" y2="94.5" stroke="#7a5028" stroke-width="0.7" opacity="0.65"/>
<line x1="29" y1="100.5" x2="61" y2="100.5" stroke="#7a5028" stroke-width="0.7" opacity="0.65"/>
<line x1="29" y1="106.5" x2="61" y2="106.5" stroke="#7a5028" stroke-width="0.7" opacity="0.65"/>
<line x1="37" y1="88.5" x2="37" y2="108.5" stroke="#7a5028" stroke-width="0.7" opacity="0.5"/>
<line x1="45" y1="88.5" x2="45" y2="108.5" stroke="#7a5028" stroke-width="0.7" opacity="0.5"/>
<line x1="53" y1="88.5" x2="53" y2="108.5" stroke="#7a5028" stroke-width="0.7" opacity="0.5"/>
<rect x="28" y="107.5" width="34" height="3.2" rx="1.6" fill="#a87838" stroke="#7a5028" stroke-width="0.9"/>
</svg>
