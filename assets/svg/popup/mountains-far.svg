    <!-- M5: peak (558,72) rightmost -->
    <g stroke="#4e7090">
      <polygon points="558,72 532,108 580,104" fill="#d8eaf5"/>
      <polygon points="532,108 508,145 545,140" fill="#c2d5e6"/>
      <polygon points="532,108 545,140 580,104" fill="#b5c8d8"/>
      <polygon points="580,104 545,140 588,138" fill="#8eb0c5"/>
      <polygon points="580,104 588,138 618,142" fill="#7ca0b8"/>
      <polygon points="508,145 490,218 545,140" fill="#a8c2d4"/>
      <polygon points="490,218 530,218 545,140" fill="#98b5c8"/>
      <polygon points="530,218 545,140 575,218" fill="#88a8bc"/>
