    <g stroke="#4a6882">
      <polygon points="178,44 155,78 198,72" fill="#dcecf6"/>
      <polygon points="155,78 128,115 162,110" fill="#c5d8e8"/>
      <polygon points="155,78 162,110 198,72" fill="#b8cede"/>
      <polygon points="198,72 162,110 215,108" fill="#9ab8cc"/>
      <polygon points="128,115 102,155 145,150" fill="#bdd2e4"/>
      <polygon points="128,115 145,150 162,110" fill="#afc6d6"/>
      <polygon points="162,110 145,150 192,148" fill="#9ab8cc"/>
      <polygon points="162,110 192,148 215,108" fill="#88a8c0"/>
      <polygon points="215,108 192,148 248,145" fill="#7898b5"/>
      <polygon points="102,155 82,218 145,150" fill="#a5c0d2"/>
      <polygon points="82,218 130,218 145,150" fill="#95b0c5"/>
      <polygon points="130,218 145,150 185,218" fill="#88a8bc"/>
      <polygon points="145,150 192,148 185,218" fill="#7898b0"/>
      <polygon points="185,218 192,148 238,218" fill="#7090a8"/>
      <polygon points="192,148 248,145 238,218" fill="#6080a0"/>
      <polygon points="238,218 248,145 278,218" fill="#587098"/>
      <polygon points="178,44 168,60 185,56" fill="#f0f8fd"/>
      <polygon points="168,60 155,78 165,72" fill="#e5f0f8"/>
    </g>

    <!-- M3: peak (308,14) TALLEST -->
    <g stroke="#3e5e80">
      <polygon points="308,14 282,52 335,48" fill="#deeef8"/>
      <polygon points="282,52 255,95 295,88" fill="#c8d8e8"/>
      <polygon points="282,52 295,88 335,48" fill="#bcd0e2"/>
      <polygon points="335,48 295,88 322,86" fill="#a8c0d5"/>
      <polygon points="335,48 322,86 358,92" fill="#98b5cc"/>
      <polygon points="255,95 225,145 262,138" fill="#c2d5e6"/>
      <polygon points="255,95 262,138 295,88" fill="#b2c8d8"/>
      <polygon points="295,88 262,138 305,134" fill="#a5c0d2"/>
      <polygon points="295,88 305,134 322,86" fill="#95b0c5"/>
      <polygon points="322,86 305,134 345,136" fill="#85a5bc"/>
      <polygon points="322,86 345,136 358,92" fill="#7598b2"/>
      <polygon points="358,92 345,136 382,142" fill="#6888a8"/>
      <polygon points="225,145 205,218 262,138" fill="#b8ccd8"/>
      <polygon points="205,218 250,218 262,138" fill="#a8bece"/>
      <polygon points="250,218 262,138 305,134" fill="#98b8c8"/>
      <polygon points="250,218 305,134 308,218" fill="#88a8bc"/>
      <polygon points="308,218 305,134 345,136" fill="#7898b0"/>
      <polygon points="308,218 345,136 365,218" fill="#6888a5"/>
      <polygon points="365,218 345,136 382,142" fill="#5878a0"/>
      <polygon points="365,218 382,142 408,218" fill="#4e6e98"/>
      <polygon points="308,14 298,35 318,30" fill="#f4fafe"/>
      <polygon points="298,35 282,52 295,44" fill="#e8f4fc"/>
      <polygon points="318,30 308,14 325,22" fill="#edf6fc"/>
    </g>

    <!-- M4: peak (440,40) -->
    <g stroke="#466080">
      <polygon points="440,40 415,76 462,72" fill="#ddedf6"/>
      <polygon points="415,76 390,115 425,108" fill="#c5d8e8"/>
      <polygon points="415,76 425,108 462,72" fill="#b8ccd8"/>
      <polygon points="462,72 425,108 468,106" fill="#a5bece"/>
      <polygon points="462,72 468,106 500,110" fill="#92b2c8"/>
      <polygon points="390,115 368,155 405,148" fill="#c0d4e5"/>
      <polygon points="390,115 405,148 425,108" fill="#b0c8d5"/>
      <polygon points="425,108 405,148 452,144" fill="#a0b8c8"/>
      <polygon points="425,108 452,144 468,106" fill="#90aec0"/>
      <polygon points="468,106 452,144 492,148" fill="#7e9eb8"/>
      <polygon points="468,106 492,148 500,110" fill="#6e90ae"/>
      <polygon points="500,110 492,148 525,152" fill="#5e80a4"/>
      <polygon points="368,155 348,218 405,148" fill="#b5cad8"/>
      <polygon points="348,218 390,218 405,148" fill="#a5bece"/>
      <polygon points="390,218 405,148 445,218" fill="#95b0c5"/>
      <polygon points="405,148 452,144 445,218" fill="#85a5bc"/>
