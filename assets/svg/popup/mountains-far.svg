  </g>

  <g id="far-micro-facets" stroke-linejoin="round" stroke-width=".45" pointer-events="none">
    <polygon class="far-facet-light" style="--d:-.4s" points="82,142 116,168 75,218" fill="#dfeef8" opacity=".34"/>
    <polygon class="far-facet-light" style="--d:-1.2s" points="145,150 168,182 130,218" fill="#d8eaf6" opacity=".32"/>
    <polygon class="far-facet-light" style="--d:-2.1s" points="192,148 218,178 185,218" fill="#cfe4f1" opacity=".28"/>
    <polygon class="far-facet-light" style="--d:-.9s" points="262,138 289,172 250,218" fill="#e6f2fa" opacity=".36"/>
    <polygon class="far-facet-light" style="--d:-3.2s" points="305,134 336,170 308,218" fill="#c8ddea" opacity=".26"/>
    <polygon class="far-facet-light" style="--d:-1.8s" points="345,136 382,170 365,218" fill="#bed4e4" opacity=".24"/>
    <polygon class="far-facet-light" style="--d:-2.7s" points="405,148 430,178 390,218" fill="#d8e8f2" opacity=".34"/>
    <polygon class="far-facet-light" style="--d:-.6s" points="452,144 486,176 445,218" fill="#c2d9e8" opacity=".28"/>
    <polygon class="far-facet-light" style="--d:-3.6s" points="545,140 568,174 530,218" fill="#dcecf6" opacity=".32"/>
    <polygon class="far-facet-light" style="--d:-2.4s" points="588,138 610,172 575,218" fill="#bad0e2" opacity=".24"/>

    <polygon points="30,110 50,80 44,124" fill="#ffffff" opacity=".12"/>
    <polygon points="155,78 178,44 172,102" fill="#ffffff" opacity=".14"/>
    <polygon points="282,52 308,14 300,104" fill="#ffffff" opacity=".15"/>
    <polygon points="415,76 440,40 432,112" fill="#ffffff" opacity=".13"/>
    <polygon points="532,108 558,72 548,142" fill="#ffffff" opacity=".11"/>
  </g>

  <g id="far-fold-lines" fill="none" stroke-linecap="round" pointer-events="none">
    <path class="far-fold" d="M50,80L42,145L30,218" stroke="#eff7fc" stroke-width=".65" stroke-opacity=".42"/>
    <path class="far-fold" d="M178,44L162,110L145,150L130,218" stroke="#eff7fc" stroke-width=".7" stroke-opacity=".45"/>
    <path class="far-fold" d="M308,14L295,88L305,134L308,218" stroke="#eff7fc" stroke-width=".8" stroke-opacity=".48"/>
    <path class="far-fold" d="M335,48L322,86L345,136L365,218" stroke="#2f587a" stroke-width=".55" stroke-opacity=".22"/>
    <path class="far-fold" d="M440,40L425,108L405,148L390,218" stroke="#eff7fc" stroke-width=".68" stroke-opacity=".44"/>
    <path class="far-fold" d="M558,72L545,140L530,218" stroke="#eff7fc" stroke-width=".62" stroke-opacity=".38"/>
    <path d="M5,148L42,145L82,142M102,155L145,150L192,148L248,145M225,145L262,138L305,134L345,136L382,142M368,155L405,148L452,144L492,148L525,152M508,145L545,140L588,138" stroke="#274c70" stroke-width=".5" stroke-opacity=".18"/>
  </g>

  <g id="far-snow-glints" pointer-events="none">
    <polygon class="far-glint" style="--d:-.3s" points="95,130 103,126 99,136" fill="url(#farFoldHi)"/>
    <polygon class="far-glint" style="--d:-2.1s" points="228,122 238,118 234,131" fill="url(#farFoldHi)"/>
    <polygon class="far-glint" style="--d:-3.6s" points="342,112 354,108 350,124" fill="url(#farFoldHi)"/>
    <polygon class="far-glint" style="--d:-1.4s" points="466,126 476,121 472,135" fill="url(#farFoldHi)"/>
    <polygon class="far-glint" style="--d:-4.5s" points="592,132 601,128 598,140" fill="url(#farFoldHi)"/>
  </g>

  <!-- Base ground strip -->
  <rect x="-20" y="214" width="644" height="7" fill="url(#farBase)" opacity=".3"/>
  <rect x="-20" y="214" width="644" height="7" fill="url(#iceTex)" opacity=".28"/>
  <!-- Atmospheric mist -->
  <path class="far-fog" d="M0,155C100,146 200,158 300,148C400,138 500,152 600,144V175H0Z" fill="url(#farMist)"/>
  <path class="far-fog" d="M-18,176C80,168 170,178 260,170C350,162 470,174 618,164V190H-18Z" fill="#d8eaf8" opacity=".12" style="animation-delay:-5s"/>
</svg>
