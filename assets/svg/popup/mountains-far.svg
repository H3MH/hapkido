<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" preserveAspectRatio="xMidYEnd meet" role="img">
  <defs>
    <style>
      #far-back-ridge{animation:farBackDrift 15s ease-in-out infinite;transform-origin:300px 218px}
      #far-main-ridge{animation:farRidgeBreath 12s ease-in-out infinite;transform-origin:300px 218px}
      .far-facet-light{animation:farFacetGlow 8.4s ease-in-out infinite;animation-delay:var(--d,0s)}
      .far-glint{animation:farGlint 6.8s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
      .far-fold{stroke-dasharray:5 7;animation:farFoldTrace 18s linear infinite}
      .far-fog{animation:farFog 14s ease-in-out infinite}
      @keyframes farBackDrift{0%,100%{transform:translateX(-2px) scale(1)}50%{transform:translateX(3px) scale(1.006)}}
      @keyframes farRidgeBreath{0%,100%{transform:skewX(0deg) translateY(0)}45%{transform:skewX(.45deg) translateY(-1.6px)}70%{transform:skewX(-.25deg) translateY(.4px)}}
      @keyframes farFacetGlow{0%,100%{opacity:.26}45%{opacity:.72}68%{opacity:.42}}
      @keyframes farGlint{0%,55%,100%{opacity:0;transform:scale(.72) rotate(0deg)}64%{opacity:.72;transform:scale(1.08) rotate(6deg)}76%{opacity:.18;transform:scale(.9) rotate(-4deg)}}
      @keyframes farFoldTrace{to{stroke-dashoffset:-72}}
      @keyframes farFog{0%,100%{transform:translateX(-7px);opacity:.36}50%{transform:translateX(9px);opacity:.58}}
      @media (prefers-reduced-motion:reduce){
        #far-back-ridge,#far-main-ridge,.far-facet-light,.far-glint,.far-fold,.far-fog{animation:none!important}
      }
    </style>
    <filter id="farSh" x="-6%" y="-14%" width="112%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#3a5870" flood-opacity=".16"/>
    </filter>
    <linearGradient id="farBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7898b5"/>
      <stop offset="1" stop-color="#5a7895"/>
    </linearGradient>
    <linearGradient id="farMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8eaf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d8eaf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="iceTex" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M2,3h1M8,2h1M13,5h1M5,11h1M11,13h1" stroke="#9ab8cc" stroke-width=".5" opacity=".28"/>
      <path d="M1,14h1M9,7h1" stroke="#fff" stroke-width=".4" opacity=".35"/>
    </pattern>
    <linearGradient id="farRidgeSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8d4e8" stop-opacity=".58"/>
      <stop offset=".55" stop-color="#7fa4c0" stop-opacity=".36"/>
      <stop offset="1" stop-color="#476a8e" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="farFoldHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d8eaf8" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <g id="far-back-ridge" opacity=".62" stroke="#6f8da8" stroke-width=".55" stroke-linejoin="round">
    <polygon points="-25,160 28,112 80,152 128,92 194,158 252,78 318,154 370,92 438,154 492,105 548,156 625,120 625,219 -25,219" fill="url(#farRidgeSoft)"/>
    <polygon points="28,112 80,152 42,166" fill="#9bb8cc" opacity=".62"/>
    <polygon points="128,92 194,158 152,170" fill="#86a8c2" opacity=".52"/>
    <polygon points="252,78 318,154 278,174" fill="#789bb8" opacity=".48"/>
    <polygon points="370,92 438,154 398,170" fill="#6d90ae" opacity=".48"/>
    <polygon points="492,105 548,156 514,174" fill="#82a2ba" opacity=".5"/>
    <path d="M28,112L42,166M128,92L152,170M252,78L278,174M370,92L398,170M492,105L514,174" fill="none" stroke="#d8eaf8" stroke-opacity=".28"/>
  </g>

  <g id="far-main-ridge" filter="url(#farSh)" stroke-linejoin="round" stroke-width=".65">

    <!-- M1: peak (50,80) leftmost -->
    <g stroke="#527090">
      <polygon points="50,80 30,110 65,105" fill="#d8eaf5"/>
      <polygon points="30,110 5,148 42,145" fill="#c2d5e5"/>
      <polygon points="30,110 42,145 65,105" fill="#b5c8d8"/>
      <polygon points="65,105 42,145 82,142" fill="#90b0c5"/>
      <polygon points="5,148 -18,218 42,145" fill="#a8c2d4"/>
      <polygon points="-18,218 30,218 42,145" fill="#98b5c8"/>
      <polygon points="30,218 42,145 75,218" fill="#88a8bc"/>
      <polygon points="42,145 75,218 82,142" fill="#7898b0"/>
      <polygon points="75,218 82,142 122,218" fill="#6888a5"/>
      <polygon points="50,80 44,95 58,90" fill="#edf5fc"/>
      <polygon points="44,95 30,110 46,105" fill="#e2eef8"/>
    </g>

